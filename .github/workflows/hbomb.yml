name: H-Bomb Daily Report

on:
  schedule:
    - cron: '17 15 * * *'   # 11 AM ET  (primary)
    - cron: '47 15 * * *'   # 11 AM ET  (backup)
    - cron: '17 19 * * *'   #  3 PM ET  (primary)
    - cron: '47 19 * * *'   #  3 PM ET  (backup)
    - cron: '17 22 * * *'   #  6 PM ET  (primary)
    - cron: '47 22 * * *'   #  6 PM ET  (backup)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hbomb-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run H-Bomb report (once) and deploy
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEY:  ${{ secrets.ODDS_API_KEY }}
        run: python HBomb40.py --once ${{ github.event_name == 'schedule' && '--skip-if-recent' || '' }}
